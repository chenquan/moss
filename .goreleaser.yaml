version: 2

builds:
  - id: moss
    main: .
    binary: moss
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]

snapshot:
  name_template: "{{ incpatch .Version }}-next"

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  disable: false
